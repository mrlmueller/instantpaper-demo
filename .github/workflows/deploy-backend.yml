name: Deploy Backend and Workers

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  GCP_REGION: europe-west3
  PDF_SCAN_GPU_REGION: europe-west1
  CLOUD_RUN_SERVICE: instantpaper-api
  TWO_LANE_TASK_WORKER_SERVICE: instantpaper-two-lane-task-worker
  CLOUD_RUN_JOB: instantpaper-two-lane-sources
  PDF_SCAN_CPU_CLOUD_RUN_JOB: instantpaper-pdf-scan-cpu
  PDF_SCAN_GPU_CLOUD_RUN_JOB: instantpaper-pdf-scan-gpu
  PDF_SCAN_ARTIFACT_PREFIX: pdf-scan-runs
  PDF_SCAN_CPU_JOB_CPU: "4"
  PDF_SCAN_CPU_JOB_MEMORY: 16Gi
  PDF_SCAN_GPU_JOB_CPU: "4"
  PDF_SCAN_GPU_JOB_MEMORY: 16Gi
  TWO_LANE_OPENALEX_RPS: "5"
  TWO_LANE_SEMANTICSCHOLAR_RPS: "1"
  TWO_LANE_PROVIDER_RATE_LIMIT_BACKEND: firestore
  TWO_LANE_PROVIDER_RATE_LIMIT_COLLECTION: quellenFinderProviderRateLimits
  TWO_LANE_PROVIDER_RATE_LIMIT_MAX_FUTURE_MS: "86400000"
  TWO_LANE_PROVIDER_RATE_LIMIT_DISPATCH_BUFFER_MS: "150"
  TWO_LANE_PROVIDER_TASK_MAX_RUNTIME_S: "480"
  TWO_LANE_OPENALEX_TASK_MAX_PAGES_PER_TASK: "12"
  TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_PAGES_PER_TASK: "5"
  TWO_LANE_OPENALEX_TASK_MAX_PAGES_TOTAL_PER_QUERY: "120"
  TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_PAGES_TOTAL_PER_QUERY: "30"
  TWO_LANE_PROVIDER_TASK_REQUEST_TIMEOUT_S: "30"
  TWO_LANE_PROVIDER_TASK_REQUEST_MAX_ATTEMPTS: "3"
  TWO_LANE_PROVIDER_TASK_REQUEST_BACKOFF_MAX_S: "15"
  TWO_LANE_TASK_DISPATCH_DEADLINE_S: "630"
  TWO_LANE_OPENALEX_TASK_QUEUE: quellen-finder-openalex
  TWO_LANE_SEMANTICSCHOLAR_TASK_QUEUE: quellen-finder-semanticscholar
  TWO_LANE_OPENALEX_TASK_MAX_CONCURRENT: "5"
  TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_CONCURRENT: "2"
  TWO_LANE_TASK_WORKER_CPU: "2"
  TWO_LANE_TASK_WORKER_MEMORY: 1Gi
  TWO_LANE_TASK_WORKER_CONCURRENCY: "2"
  TWO_LANE_TASK_WORKER_TIMEOUT: "600"
  IMAGE_REPOSITORY: cloud-run-source-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 557.0.0"

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set image tag
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${IMAGE_REPOSITORY}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          GPU_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${IMAGE_REPOSITORY}/${PDF_SCAN_GPU_CLOUD_RUN_JOB}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "GPU_IMAGE=$GPU_IMAGE" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push GPU Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.gpu
          push: true
          tags: ${{ env.GPU_IMAGE }}
          provenance: false
          sbom: false
          build-args: |
            PRELOAD_PDF_SCAN_RERANKER=0

      - name: Migrate Firebase runtime vars off secrets
        run: |
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" \
            --remove-secrets "FIREBASE_PROJECT_ID,FIREBASE_CLIENT_EMAIL,FIREBASE_PRIVATE_KEY" || true

      - name: Deploy FastAPI service
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" \
            --image "$IMAGE" \
            --allow-unauthenticated \
            --service-account "instantpaper-api-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --remove-env-vars "PDF_SCAN_CLOUD_RUN_JOB_NAME,PDF_SCAN_CLOUD_RUN_JOB_REGION,PDF_SCAN_FORCE_CLOUD_RUN_FROM_LOCAL" \
            --update-env-vars "GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${FIREBASE_PROJECT_ID}.firebasestorage.app,TWO_LANE_CLOUD_RUN_JOB_NAME=${CLOUD_RUN_JOB},TWO_LANE_CLOUD_RUN_JOB_REGION=${GCP_REGION},TWO_LANE_SOURCES_EXECUTION_BACKEND=cloud_run_split_jobs,TWO_LANE_ARTIFACT_BUCKET=${FIREBASE_PROJECT_ID}.firebasestorage.app,TWO_LANE_ARTIFACT_PREFIX=two-lane-runs,TWO_LANE_OPENALEX_RPS=${TWO_LANE_OPENALEX_RPS},TWO_LANE_SEMANTICSCHOLAR_RPS=${TWO_LANE_SEMANTICSCHOLAR_RPS},TWO_LANE_PROVIDER_RATE_LIMIT_BACKEND=${TWO_LANE_PROVIDER_RATE_LIMIT_BACKEND},TWO_LANE_PROVIDER_RATE_LIMIT_COLLECTION=${TWO_LANE_PROVIDER_RATE_LIMIT_COLLECTION},TWO_LANE_PROVIDER_RATE_LIMIT_MAX_FUTURE_MS=${TWO_LANE_PROVIDER_RATE_LIMIT_MAX_FUTURE_MS},TWO_LANE_PROVIDER_RATE_LIMIT_DISPATCH_BUFFER_MS=${TWO_LANE_PROVIDER_RATE_LIMIT_DISPATCH_BUFFER_MS},TWO_LANE_PROVIDER_TASK_MAX_RUNTIME_S=${TWO_LANE_PROVIDER_TASK_MAX_RUNTIME_S},TWO_LANE_OPENALEX_TASK_MAX_PAGES_PER_TASK=${TWO_LANE_OPENALEX_TASK_MAX_PAGES_PER_TASK},TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_PAGES_PER_TASK=${TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_PAGES_PER_TASK},TWO_LANE_OPENALEX_TASK_MAX_PAGES_TOTAL_PER_QUERY=${TWO_LANE_OPENALEX_TASK_MAX_PAGES_TOTAL_PER_QUERY},TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_PAGES_TOTAL_PER_QUERY=${TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_PAGES_TOTAL_PER_QUERY},TWO_LANE_PROVIDER_TASK_REQUEST_TIMEOUT_S=${TWO_LANE_PROVIDER_TASK_REQUEST_TIMEOUT_S},TWO_LANE_PROVIDER_TASK_REQUEST_MAX_ATTEMPTS=${TWO_LANE_PROVIDER_TASK_REQUEST_MAX_ATTEMPTS},TWO_LANE_PROVIDER_TASK_REQUEST_BACKOFF_MAX_S=${TWO_LANE_PROVIDER_TASK_REQUEST_BACKOFF_MAX_S},TWO_LANE_TASK_DISPATCH_DEADLINE_S=${TWO_LANE_TASK_DISPATCH_DEADLINE_S},TWO_LANE_TASK_DISPATCH_BACKEND=cloud_tasks,TWO_LANE_TASKS_PROJECT=${GCP_PROJECT_ID},TWO_LANE_TASKS_LOCATION=${GCP_REGION},TWO_LANE_OPENALEX_TASK_QUEUE=${TWO_LANE_OPENALEX_TASK_QUEUE},TWO_LANE_SEMANTICSCHOLAR_TASK_QUEUE=${TWO_LANE_SEMANTICSCHOLAR_TASK_QUEUE},PDF_SCAN_CPU_CLOUD_RUN_JOB_NAME=${PDF_SCAN_CPU_CLOUD_RUN_JOB},PDF_SCAN_CPU_CLOUD_RUN_JOB_REGION=${GCP_REGION},PDF_SCAN_GPU_CLOUD_RUN_JOB_NAME=${PDF_SCAN_GPU_CLOUD_RUN_JOB},PDF_SCAN_GPU_CLOUD_RUN_JOB_REGION=${PDF_SCAN_GPU_REGION},PDF_SCAN_ARTIFACT_BUCKET=${FIREBASE_PROJECT_ID}.firebasestorage.app,PDF_SCAN_ARTIFACT_PREFIX=${PDF_SCAN_ARTIFACT_PREFIX},PDF_SCAN_EXECUTION_BACKEND=cloud_run_split_jobs" \
            --update-secrets "OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENALEX_API_KEY=OPENALEX_API_KEY:latest,SEMANTICSCHOLAR_API_KEY=SEMANTICSCHOLAR_API_KEY:latest,ALLOWED_ORIGINS=ALLOWED_ORIGINS:latest,USER_KEY_ENCRYPTION_KEY=USER_KEY_ENCRYPTION_KEY:latest,ADMIN_UIDS=ADMIN_UIDS:latest"

      - name: Capture FastAPI service URL
        run: |
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --format='value(status.url)')"
          echo "CLOUD_RUN_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - name: Deploy two-lane task worker service
        run: |
          gcloud run deploy "$TWO_LANE_TASK_WORKER_SERVICE" \
            --region "$GCP_REGION" \
            --image "$IMAGE" \
            --allow-unauthenticated \
            --service-account "instantpaper-api-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --cpu "${TWO_LANE_TASK_WORKER_CPU}" \
            --memory "${TWO_LANE_TASK_WORKER_MEMORY}" \
            --concurrency "${TWO_LANE_TASK_WORKER_CONCURRENCY}" \
            --timeout "${TWO_LANE_TASK_WORKER_TIMEOUT}" \
            --max-instances 20 \
            --update-env-vars "GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${FIREBASE_PROJECT_ID}.firebasestorage.app,TWO_LANE_CLOUD_RUN_JOB_NAME=${CLOUD_RUN_JOB},TWO_LANE_CLOUD_RUN_JOB_REGION=${GCP_REGION},TWO_LANE_SOURCES_EXECUTION_BACKEND=cloud_run_split_jobs,TWO_LANE_ARTIFACT_BUCKET=${FIREBASE_PROJECT_ID}.firebasestorage.app,TWO_LANE_ARTIFACT_PREFIX=two-lane-runs,TWO_LANE_OPENALEX_RPS=${TWO_LANE_OPENALEX_RPS},TWO_LANE_SEMANTICSCHOLAR_RPS=${TWO_LANE_SEMANTICSCHOLAR_RPS},TWO_LANE_PROVIDER_RATE_LIMIT_BACKEND=${TWO_LANE_PROVIDER_RATE_LIMIT_BACKEND},TWO_LANE_PROVIDER_RATE_LIMIT_COLLECTION=${TWO_LANE_PROVIDER_RATE_LIMIT_COLLECTION},TWO_LANE_PROVIDER_RATE_LIMIT_MAX_FUTURE_MS=${TWO_LANE_PROVIDER_RATE_LIMIT_MAX_FUTURE_MS},TWO_LANE_PROVIDER_RATE_LIMIT_DISPATCH_BUFFER_MS=${TWO_LANE_PROVIDER_RATE_LIMIT_DISPATCH_BUFFER_MS},TWO_LANE_PROVIDER_TASK_MAX_RUNTIME_S=${TWO_LANE_PROVIDER_TASK_MAX_RUNTIME_S},TWO_LANE_OPENALEX_TASK_MAX_PAGES_PER_TASK=${TWO_LANE_OPENALEX_TASK_MAX_PAGES_PER_TASK},TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_PAGES_PER_TASK=${TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_PAGES_PER_TASK},TWO_LANE_OPENALEX_TASK_MAX_PAGES_TOTAL_PER_QUERY=${TWO_LANE_OPENALEX_TASK_MAX_PAGES_TOTAL_PER_QUERY},TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_PAGES_TOTAL_PER_QUERY=${TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_PAGES_TOTAL_PER_QUERY},TWO_LANE_PROVIDER_TASK_REQUEST_TIMEOUT_S=${TWO_LANE_PROVIDER_TASK_REQUEST_TIMEOUT_S},TWO_LANE_PROVIDER_TASK_REQUEST_MAX_ATTEMPTS=${TWO_LANE_PROVIDER_TASK_REQUEST_MAX_ATTEMPTS},TWO_LANE_PROVIDER_TASK_REQUEST_BACKOFF_MAX_S=${TWO_LANE_PROVIDER_TASK_REQUEST_BACKOFF_MAX_S},TWO_LANE_TASK_DISPATCH_DEADLINE_S=${TWO_LANE_TASK_DISPATCH_DEADLINE_S},TWO_LANE_TASK_DISPATCH_BACKEND=cloud_tasks,TWO_LANE_TASKS_PROJECT=${GCP_PROJECT_ID},TWO_LANE_TASKS_LOCATION=${GCP_REGION},TWO_LANE_OPENALEX_TASK_QUEUE=${TWO_LANE_OPENALEX_TASK_QUEUE},TWO_LANE_SEMANTICSCHOLAR_TASK_QUEUE=${TWO_LANE_SEMANTICSCHOLAR_TASK_QUEUE}" \
            --update-secrets "OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENALEX_API_KEY=OPENALEX_API_KEY:latest,SEMANTICSCHOLAR_API_KEY=SEMANTICSCHOLAR_API_KEY:latest,ALLOWED_ORIGINS=ALLOWED_ORIGINS:latest,USER_KEY_ENCRYPTION_KEY=USER_KEY_ENCRYPTION_KEY:latest,ADMIN_UIDS=ADMIN_UIDS:latest,TWO_LANE_TASK_DISPATCH_TOKEN=TWO_LANE_TASK_DISPATCH_TOKEN:latest"

      - name: Capture two-lane task worker URL
        run: |
          WORKER_URL="$(gcloud run services describe "$TWO_LANE_TASK_WORKER_SERVICE" --region "$GCP_REGION" --format='value(status.url)')"
          echo "TWO_LANE_TASK_WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"

      - name: Configure two-lane provider queues
        run: |
          configure_queue() {
            local queue_name="$1"
            local max_dispatch="$2"
            local max_concurrent="$3"
            if gcloud tasks queues describe "$queue_name" --location "$GCP_REGION" >/dev/null 2>&1; then
              gcloud tasks queues update "$queue_name" \
                --location "$GCP_REGION" \
                --max-dispatches-per-second "$max_dispatch" \
                --max-concurrent-dispatches "$max_concurrent" \
                --max-attempts 25 \
                --min-backoff 5s \
                --max-backoff 300s \
                --max-doublings 5
            else
              gcloud tasks queues create "$queue_name" \
                --location "$GCP_REGION" \
                --max-dispatches-per-second "$max_dispatch" \
                --max-concurrent-dispatches "$max_concurrent" \
                --max-attempts 25 \
                --min-backoff 5s \
                --max-backoff 300s \
                --max-doublings 5
            fi
          }

          configure_queue "$TWO_LANE_OPENALEX_TASK_QUEUE" "$TWO_LANE_OPENALEX_RPS" "$TWO_LANE_OPENALEX_TASK_MAX_CONCURRENT"
          configure_queue "$TWO_LANE_SEMANTICSCHOLAR_TASK_QUEUE" "$TWO_LANE_SEMANTICSCHOLAR_RPS" "$TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_CONCURRENT"

      - name: Finalize two-lane task handler settings
        run: |
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" \
            --update-env-vars "TWO_LANE_TASK_HANDLER_URL=${TWO_LANE_TASK_WORKER_URL}/api/internal/quellen-finder/two-lane/task" \
            --update-secrets "TWO_LANE_TASK_DISPATCH_TOKEN=TWO_LANE_TASK_DISPATCH_TOKEN:latest"
          gcloud run services update "$TWO_LANE_TASK_WORKER_SERVICE" \
            --region "$GCP_REGION" \
            --update-env-vars "TWO_LANE_TASK_HANDLER_URL=${TWO_LANE_TASK_WORKER_URL}/api/internal/quellen-finder/two-lane/task" \
            --update-secrets "TWO_LANE_TASK_DISPATCH_TOKEN=TWO_LANE_TASK_DISPATCH_TOKEN:latest"

      - name: Deploy two-lane Cloud Run Job
        run: |
          COMMON_FLAGS=(
            --region "$GCP_REGION"
            --image "$IMAGE"
            --service-account "instantpaper-two-lane-job@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
            --cpu 4
            --memory 16Gi
            --tasks 1
            --parallelism 1
            --max-retries 0
            --task-timeout 2h
            --command python
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${FIREBASE_PROJECT_ID}.firebasestorage.app,TWO_LANE_SOURCES_EXECUTION_BACKEND=cloud_run_split_jobs,TWO_LANE_ARTIFACT_BUCKET=${FIREBASE_PROJECT_ID}.firebasestorage.app,TWO_LANE_ARTIFACT_PREFIX=two-lane-runs,TWO_LANE_OPENALEX_RPS=${TWO_LANE_OPENALEX_RPS},TWO_LANE_SEMANTICSCHOLAR_RPS=${TWO_LANE_SEMANTICSCHOLAR_RPS},TWO_LANE_PROVIDER_RATE_LIMIT_BACKEND=${TWO_LANE_PROVIDER_RATE_LIMIT_BACKEND},TWO_LANE_PROVIDER_RATE_LIMIT_COLLECTION=${TWO_LANE_PROVIDER_RATE_LIMIT_COLLECTION},TWO_LANE_PROVIDER_RATE_LIMIT_MAX_FUTURE_MS=${TWO_LANE_PROVIDER_RATE_LIMIT_MAX_FUTURE_MS},TWO_LANE_PROVIDER_RATE_LIMIT_DISPATCH_BUFFER_MS=${TWO_LANE_PROVIDER_RATE_LIMIT_DISPATCH_BUFFER_MS},TWO_LANE_PROVIDER_TASK_MAX_RUNTIME_S=${TWO_LANE_PROVIDER_TASK_MAX_RUNTIME_S},TWO_LANE_OPENALEX_TASK_MAX_PAGES_PER_TASK=${TWO_LANE_OPENALEX_TASK_MAX_PAGES_PER_TASK},TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_PAGES_PER_TASK=${TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_PAGES_PER_TASK},TWO_LANE_OPENALEX_TASK_MAX_PAGES_TOTAL_PER_QUERY=${TWO_LANE_OPENALEX_TASK_MAX_PAGES_TOTAL_PER_QUERY},TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_PAGES_TOTAL_PER_QUERY=${TWO_LANE_SEMANTICSCHOLAR_TASK_MAX_PAGES_TOTAL_PER_QUERY},TWO_LANE_PROVIDER_TASK_REQUEST_TIMEOUT_S=${TWO_LANE_PROVIDER_TASK_REQUEST_TIMEOUT_S},TWO_LANE_PROVIDER_TASK_REQUEST_MAX_ATTEMPTS=${TWO_LANE_PROVIDER_TASK_REQUEST_MAX_ATTEMPTS},TWO_LANE_PROVIDER_TASK_REQUEST_BACKOFF_MAX_S=${TWO_LANE_PROVIDER_TASK_REQUEST_BACKOFF_MAX_S},TWO_LANE_TASK_DISPATCH_DEADLINE_S=${TWO_LANE_TASK_DISPATCH_DEADLINE_S},TWO_LANE_TASK_DISPATCH_BACKEND=cloud_tasks,TWO_LANE_TASKS_PROJECT=${GCP_PROJECT_ID},TWO_LANE_TASKS_LOCATION=${GCP_REGION},TWO_LANE_OPENALEX_TASK_QUEUE=${TWO_LANE_OPENALEX_TASK_QUEUE},TWO_LANE_SEMANTICSCHOLAR_TASK_QUEUE=${TWO_LANE_SEMANTICSCHOLAR_TASK_QUEUE},TWO_LANE_TASK_HANDLER_URL=${TWO_LANE_TASK_WORKER_URL}/api/internal/quellen-finder/two-lane/task"
            --set-secrets "OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENALEX_API_KEY=OPENALEX_API_KEY:latest,SEMANTICSCHOLAR_API_KEY=SEMANTICSCHOLAR_API_KEY:latest,TWO_LANE_TASK_DISPATCH_TOKEN=TWO_LANE_TASK_DISPATCH_TOKEN:latest"
          )

          if gcloud run jobs describe "$CLOUD_RUN_JOB" --region "$GCP_REGION" >/dev/null 2>&1; then
            gcloud run jobs update "$CLOUD_RUN_JOB" "${COMMON_FLAGS[@]}"
          else
            gcloud run jobs create "$CLOUD_RUN_JOB" "${COMMON_FLAGS[@]}"
          fi

      - name: Deploy PDF scan CPU Cloud Run Job
        run: |
          COMMON_FLAGS=(
            --region "$GCP_REGION"
            --image "$IMAGE"
            --service-account "instantpaper-two-lane-job@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
            --cpu "${PDF_SCAN_CPU_JOB_CPU}"
            --memory "${PDF_SCAN_CPU_JOB_MEMORY}"
            --tasks 1
            --parallelism 1
            --max-retries 0
            --task-timeout 4h
            --command python
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${FIREBASE_PROJECT_ID}.firebasestorage.app,PDF_SCAN_ARTIFACT_BUCKET=${FIREBASE_PROJECT_ID}.firebasestorage.app,PDF_SCAN_ARTIFACT_PREFIX=${PDF_SCAN_ARTIFACT_PREFIX},PDF_SCAN_EXECUTION_BACKEND=cloud_run_split_jobs,PDF_SCAN_GPU_CLOUD_RUN_JOB_NAME=${PDF_SCAN_GPU_CLOUD_RUN_JOB},PDF_SCAN_GPU_CLOUD_RUN_JOB_REGION=${PDF_SCAN_GPU_REGION}"
            --set-secrets "OPENAI_API_KEY=OPENAI_API_KEY:latest"
          )

          if gcloud run jobs describe "$PDF_SCAN_CPU_CLOUD_RUN_JOB" --region "$GCP_REGION" >/dev/null 2>&1; then
            gcloud run jobs update "$PDF_SCAN_CPU_CLOUD_RUN_JOB" "${COMMON_FLAGS[@]}"
          else
            gcloud run jobs create "$PDF_SCAN_CPU_CLOUD_RUN_JOB" "${COMMON_FLAGS[@]}"
          fi

      - name: Deploy PDF scan GPU Cloud Run Job
        run: |
          COMMON_FLAGS=(
            --region "$PDF_SCAN_GPU_REGION"
            --image "$GPU_IMAGE"
            --service-account "instantpaper-two-lane-job@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
            --cpu "${PDF_SCAN_GPU_JOB_CPU}"
            --memory "${PDF_SCAN_GPU_JOB_MEMORY}"
            --gpu 1
            --gpu-type nvidia-l4
            --no-gpu-zonal-redundancy
            --tasks 1
            --parallelism 1
            --max-retries 0
            --task-timeout 1h
            --command python
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${FIREBASE_PROJECT_ID}.firebasestorage.app,PDF_SCAN_ARTIFACT_BUCKET=${FIREBASE_PROJECT_ID}.firebasestorage.app,PDF_SCAN_ARTIFACT_PREFIX=${PDF_SCAN_ARTIFACT_PREFIX},PDF_SCAN_EXECUTION_BACKEND=cloud_run_split_jobs"
            --set-secrets "OPENAI_API_KEY=OPENAI_API_KEY:latest"
          )

          if gcloud run jobs describe "$PDF_SCAN_GPU_CLOUD_RUN_JOB" --region "$PDF_SCAN_GPU_REGION" >/dev/null 2>&1; then
            gcloud run jobs update "$PDF_SCAN_GPU_CLOUD_RUN_JOB" "${COMMON_FLAGS[@]}"
          else
            gcloud run jobs create "$PDF_SCAN_GPU_CLOUD_RUN_JOB" "${COMMON_FLAGS[@]}"
          fi
