name: Deploy FastAPI and Workers

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  GCP_REGION: europe-west3
  CLOUD_RUN_SERVICE: instantpaper-api
  CLOUD_RUN_JOB: instantpaper-two-lane-sources
  PDF_SCAN_CLOUD_RUN_JOB: instantpaper-pdf-scan
  IMAGE_REPOSITORY: cloud-run-source-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set image tag
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${IMAGE_REPOSITORY}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fastapi/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migrate Firebase runtime vars off secrets
        run: |
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" \
            --remove-secrets "FIREBASE_PROJECT_ID,FIREBASE_CLIENT_EMAIL,FIREBASE_PRIVATE_KEY" || true

      - name: Deploy FastAPI service
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" \
            --image "$IMAGE" \
            --allow-unauthenticated \
            --service-account "instantpaper-api-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --update-env-vars "GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${FIREBASE_PROJECT_ID}.firebasestorage.app,TWO_LANE_CLOUD_RUN_JOB_NAME=${CLOUD_RUN_JOB},TWO_LANE_CLOUD_RUN_JOB_REGION=${GCP_REGION},TWO_LANE_SOURCES_EXECUTION_BACKEND=cloud_run_job,PDF_SCAN_CLOUD_RUN_JOB_NAME=${PDF_SCAN_CLOUD_RUN_JOB},PDF_SCAN_CLOUD_RUN_JOB_REGION=${GCP_REGION},PDF_SCAN_EXECUTION_BACKEND=cloud_run_job" \
            --update-secrets "OPENAI_API_KEY=OPENAI_API_KEY:latest,ALLOWED_ORIGINS=ALLOWED_ORIGINS:latest,USER_KEY_ENCRYPTION_KEY=USER_KEY_ENCRYPTION_KEY:latest,ADMIN_UIDS=ADMIN_UIDS:latest"

      - name: Deploy two-lane Cloud Run Job
        run: |
          COMMON_FLAGS=(
            --region "$GCP_REGION"
            --image "$IMAGE"
            --service-account "instantpaper-two-lane-job@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
            --cpu 4
            --memory 16Gi
            --tasks 1
            --parallelism 1
            --max-retries 0
            --task-timeout 2h
            --command python
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${FIREBASE_PROJECT_ID}.firebasestorage.app"
            --set-secrets "OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENALEX_API_KEY=OPENALEX_API_KEY:latest,SEMANTICSCHOLAR_API_KEY=SEMANTICSCHOLAR_API_KEY:latest"
          )

          if gcloud run jobs describe "$CLOUD_RUN_JOB" --region "$GCP_REGION" >/dev/null 2>&1; then
            gcloud run jobs update "$CLOUD_RUN_JOB" "${COMMON_FLAGS[@]}"
          else
            gcloud run jobs create "$CLOUD_RUN_JOB" "${COMMON_FLAGS[@]}"
          fi

      - name: Deploy PDF scan Cloud Run Job
        run: |
          COMMON_FLAGS=(
            --region "$GCP_REGION"
            --image "$IMAGE"
            --service-account "instantpaper-two-lane-job@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
            --cpu 4
            --memory 16Gi
            --tasks 1
            --parallelism 1
            --max-retries 0
            --task-timeout 4h
            --command python
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${FIREBASE_PROJECT_ID}.firebasestorage.app"
            --set-secrets "OPENAI_API_KEY=OPENAI_API_KEY:latest"
          )

          if gcloud run jobs describe "$PDF_SCAN_CLOUD_RUN_JOB" --region "$GCP_REGION" >/dev/null 2>&1; then
            gcloud run jobs update "$PDF_SCAN_CLOUD_RUN_JOB" "${COMMON_FLAGS[@]}"
          else
            gcloud run jobs create "$PDF_SCAN_CLOUD_RUN_JOB" "${COMMON_FLAGS[@]}"
          fi
